<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        body{
            font-family: Arial, sans-serif;
        }
        /*Navbar*/
        .navbar{
            background-color:#222 ;
            padding: 15px30px;
            display: flex;
            align-items:center;
        }
        .logo{
            color:white;
            font-size:22px ;
            font-weight:bold;
            margin-right:auto;
        }
        /*========================== 
        THEME BUTTONS
        ============================*/
        .theme-buttons{
            display: flex;
            gap:10px;
            margin-right: 20px;
        }
        .theme-buttons a{
            color: white;
            text-decoration: none;
            border: 1px solid #00bcd4;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 14px;
        }
        .theme-buttons a:hover{
            background-color: #00bcd4;
        }
        /*Navigation links*/
        .nav-links{
            display: flex;
            align-items: center;
            list-style:none;
            gap:20px;
        }
        .nav-links a{
            color:white;
            text-decoration:none;
            font-size:16px;
        }
        .nav-links a:hover{
            color:#00bcd4;
        }
        /*login button*/
        .login-btn{
            border:1pxsolid#00bcd4;
            padding:8px15px;
            border-radius: 5px;
        }
        .login-btn:hover{
            background-color: #00bcd4;
            color:white!important;
        }
        /*Register button*/
        .register-btn{
            background-color:#00bcd4;
            padding:8px15px;
            border-radius:5px;
        }
        .register-btn:hover{
            background-color:#0097a7;
            color:white!important;
        }
        /*content*/
        .content{
            padding:50px;
            text-align:center;
        }
    </style>
</head>
<body class="{{theme}}">
    <nav class="navbar">
        <div class="logo">
            Employee Management System

        </div>
        #THEME-BUTTONS
        <div class=""theme-buttons">
             <a href="/set-theme/light">Light</a>
             <a href="/set-theme/dark">Dark</a>
        </div>
        <ul class="nav-links">
            <li>
                <a href="/">
                   Home
                 </a>
            </li>
            <li>
                <a href="/employees">
                    Employees
                </a>
            </li>
            <li>
                <a href="/add-employee">
                    AddEmployee
                </a>
            </li>
            <li>
                <a href="/Search">
                    Search
                </a>
            </li>
            <li>
            <!-- LOGOUT -->
                <a href="/logout" class="logout-button">
                    Logout
                </a>
            </li>
        </ul>
    </nav>
    <div class="content">
        {% if fullname %}
        <h1>
            Welcome,{{fullname}}!
        </h1>
        {% else %}
        <h1>Welcome to Employee Management System </h1>
        {% endif %}
        <p>
            Manage your Employees Easily
        </p>
    </div>
</body>
</html>
