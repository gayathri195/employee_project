<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        body{
            font-family: Arial, sans-serif;
        }

        /* LIGHT MODE */

        body.light{
            background-color: #f5f5f5;
            color:#222 ;
        }

        body.light.content{
            background-color: white;
            color: #222;
        }

        body.light.content h1{
            color: #222;
        }

        body.light.content p{
            color: #555;
        }

        /* DARK MODE */

        body.dark{
            background-color: #121212;
            color: white;
        }

        body.dark.content{
            background-color: #1e1e1e;
            color: white;
        }

        body.dark.content h1{
            color: white;
        }

        body.dark.content p{
            color: #ddd;
        }
        /*Navbar*/
        .navbar{
            background-color:#222 ;
            padding: 15px30px;
            display: flex;
            align-items:center;
        }
        .logo{
            color:white;
            font-size:22px ;
            font-weight:bold;
            margin-right:auto;
        }
        /*========================== 
        THEME BUTTONS
        ============================*/
        .theme-buttons{
            display: flex;
            gap:10px;
            margin-right: 20px;
        }
        .theme-buttons a{
            color: white;
            text-decoration: none;
            border: 1px solid #00bcd4;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 14px;
        }
        .theme-buttons a:hover{
            background-color: #00bcd4;
        }
        /*Navigation links*/
        .nav-links{
            display: flex;
            align-items: center;
            list-style:none;
            gap:20px;
        }
        .nav-links a{
            color:white;
            text-decoration:none;
            font-size:16px;
        }
        .nav-links a:hover{
            color:#00bcd4;
        }
        nav ul li a {
              color: white !important;
              text-decoration: none;
}
        /*login button*/
        .login-btn{
            border:1pxsolid#00bcd4;
            padding:8px15px;
            border-radius: 5px;
        }
        .login-btn:hover{
            background-color: #00bcd4;
            color:white!important;
        }
        /*Register button*/
        .register-btn{
            background-color:#00bcd4;
            padding:8px15px;
            border-radius:5px;
        }
        .register-btn:hover{
            background-color:#0097a7;
            color:white!important;
        }
       /*Contact Us button*/
        .contactus-btn{
            background-color:white;
            padding:8px15px;
            border-radius:5px;
        }
        .contactus-btn:hover{
            background-color:white;
            color:white!important;
        }
        /*content*/
        .content{
            padding:50px;
            text-align:center;
        }
        .content h1{
            font-size: 18px;
        }
        .content p{
            font-size:18px ;
        }
         

        /* MOBILE RESPONSIVE */

        @media (max-width:900px){
            .navbar{
                    flex-wrap: wrap;
                    gap: 15px;
            }
            .logo{
                width: 100%;
                text-align: center;
                margin-right: 0;
            }
            .theme-buttons{
                margin-right: 0;
            }
            .nav-links{
                flex-wrap: wrap;
                justify-content: center;
            }
        }

    </style>
</head>
<body class="{{theme}}">
    <nav class="navbar">
        <div class="logo">
            Employee Management System
        </div>
        
        <div class="theme-buttons">
             <a href="/set-theme/light">Light</a>
             <a href="/set-theme/dark">Dark</a>
        </div>
        <ul class="nav-links">
            <li>
                <a href="/employees">
                    Employees
                </a>
            </li>
            <li>
                <a href="/add-employee">
                    AddEmployee
                </a>
            </li>
            <li>
            <!-- LOGOUT -->
                <a href="/logout" class="logout-button">
                    Logout
                </a>
            </li>
        <li>
            <!-- CONTACTUS -->
             <a href="/contactus">Contact Us</a>
        </li>
        </ul>
    </nav>
    <div class="content">
        {% if fullname %}
        <h1>
            Welcome,{{fullname}}!
        </h1>
        {% else %}
        <h1>Welcome to Employee Management System </h1>
        {% endif %}
        <p>
            Manage your Employees Easily
        </p>
    </div>
</body>
</html>
